[project]
name = "slm-from-scratch"
version = "2.0.0"
description = "A 259M-parameter decoder-only small language model built from scratch in PyTorch"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
